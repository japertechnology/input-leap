[tool.towncrier]
    # Package name is unused but required by towncrier; leave blank to avoid
    # embedding a Python package path.
    package = ""
    # Directory containing individual news fragment files referenced in release
    # notes.
    directory = "doc/newsfragments"
    # Path to the consolidated release notes file generated by towncrier.
    filename = "doc/release_notes/index.md"
    # Jinja2 template used to render the release notes.
    template = "doc/release_notes/index.template.jinja"
    # Header format placed at the start of the release notes for each version.
    title_format = "\nInputLeap `{version}` ( `{project_date}` )\n================================\n"
    # Marker used to identify where new notes should be inserted.
    start_string = "[comment]: <> (towncrier release notes start)"
    [[tool.towncrier.section]]
        path = ""

    # Define the categories of news fragments recognised by towncrier. Each
    # type corresponds to a directory inside doc/newsfragments.
    [[tool.towncrier.type]]
        directory = "security"
        name = "Security fixes"
        showcontent = false

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bug fixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Improved Documentation"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "Deprecations and Removals"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Miscellaneous"
        showcontent = false
